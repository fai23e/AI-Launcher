<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Customizer - クイックアクセス</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="popup-header">
            <h1>クイックアクセス</h1>
            <input type="search" id="popup-search" placeholder="プリセットを検索...">
        </header>
        <main class="popup-main">
            <ul id="popup-preset-list">
                <!-- プリセットがここに動的に表示されます -->
            </ul>
        </main>
        <footer class="popup-footer">
            <a href="#" id="open-options-page">詳細設定を開く</a>
        </footer>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>
